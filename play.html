<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitch Royale — vrij spelen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ============ MATCH (no clock, straight into play) ============ -->
    <div id="game-screen" class="screen">
        <div class="scorebug">
            <div class="scorebug__team scorebug__team--red">
                <span class="scorebug__name" id="hud-p1-name">P1</span>
            </div>
            <div class="scorebug__score" aria-label="Stand">
                <span id="hud-s1">0</span>
                <span aria-hidden="true">–</span>
                <span id="hud-s2">0</span>
            </div>
            <div class="scorebug__team scorebug__team--blue">
                <span class="scorebug__name" id="hud-p2-name">P2</span>
            </div>
            <div class="scorebug__clock" id="hud-timer">∞</div>
        </div>

        <!-- key legends, filled in by paintHud() -->
        <div class="hud-keys hud-keys--left" id="hud-keys-p1"></div>
        <div class="hud-keys hud-keys--right" id="hud-keys-p2"></div>

        <div class="kickoff-overlay" id="kickoff-overlay" hidden>
            <div class="kickoff-board">
                <div class="kickoff-overlay__lbl">Aftrap</div>
                <div class="kickoff-overlay__num" id="kickoff-num">3</div>
            </div>
        </div>

        <div class="goal-flash" id="goal-flash" hidden>
            <div class="goal-flash__text">Doelpunt!</div>
            <div class="goal-flash__sub" id="goal-flash-sub">P1</div>
        </div>

        <button id="pause-btn" class="pause-btn" type="button" title="Pauze (P of Esc)" aria-label="Pauze">
            <span></span><span></span>
        </button>

        <div id="pause-overlay" class="pause-overlay" hidden>
            <div class="pause-overlay__panel paper">
                <div class="pause-overlay__title">Pauze</div>
                <div class="pause-overlay__sub">Druk op <kbd>P</kbd> of <kbd>Esc</kbd> om verder te spelen.</div>
                <button id="pause-resume" class="btn" type="button">Verder spelen</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="game.core.js"></script>
    <script src="game.stadium.js"></script>
    <script src="game.ui.js"></script>
    <script src="game.js"></script>
</body>
</html>
